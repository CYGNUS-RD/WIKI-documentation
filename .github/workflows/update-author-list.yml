name: Update CYGNO author list

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: update-author-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Generate author list
        working-directory: AuthorList
        env:
          MPLBACKEND: Agg
        run: |
          python GetAuthorList.py --gsheet

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add AuthorList/latex_author.txt AuthorList/authors.png

          if git diff --cached --quiet; then
            echo "Author list unchanged."
            exit 0
          fi

          git commit -m "chore: update CYGNO author list"
          git push